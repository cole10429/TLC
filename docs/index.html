<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tender Loving Carpentry</title>
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --text: #1f1b17;
    --muted: #6b6358;
    --border: #e5dfd6;
    --accent: #5c4530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main {
    width: min(92vw, 560px);
    padding: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(31, 27, 23, 0.04), 0 12px 32px rgba(31, 27, 23, 0.06);
  }
  img {
    width: 96px;
    height: auto;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.75rem, 1.2rem + 2vw, 2.5rem);
    line-height: 1.1;
    letter-spacing: 0;
  }
  p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="quotes/hilary-smee/assets/tlc-logo.png" alt="Tender Loving Carpentry logo" width="96" height="72">
  <h1>Tender Loving Carpentry</h1>
  <p>Please use the direct quote link provided in your email.</p>
</main>
</body>
</html>
